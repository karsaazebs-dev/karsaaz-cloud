name: karsaaz-cloud

services:
  db:
    image: localhost:5000/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
      - FOWNER
    mem_limit: 1g
    pids_limit: 200

  redis:
    image: localhost:5000/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxclients", "1000"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    mem_limit: 512m
    pids_limit: 500

  # Collabora Online — LibreOffice-in-the-browser engine for Karsaaz Cloud Office.
  # Communicates with the app container via WOPI protocol on the internal Docker network.
  # Browser hits port 9980 directly when opening a doc. No outbound to external vendor servers.
  collabora:
    image: localhost:5000/collabora-online:24.04.13.1.1
    restart: unless-stopped
    ports:
      - "${COLLABORA_PORT}:9980"
    environment:
      # Domain regex — which hosts are allowed to embed the editor
      # Matches: localhost, 127.0.0.1, any 192.168.x.x, 10.x.x.x LAN IP
      domain: 'localhost|127\\.0\\.0\\.1|192\\.168\\.[0-9]+\\.[0-9]+|10\\.[0-9]+\\.[0-9]+\\.[0-9]+'
      username: ${COLLABORA_ADMIN_USER}
      password: ${COLLABORA_ADMIN_PASSWORD}
      # Disable welcome screen, telemetry, and update banner
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:welcome.enable=false
        --o:home_mode.enable=false
        --o:net.frame_ancestors=
        --o:logging.level=warning
    cap_add:
      - MKNOD
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    mem_limit: 2g
    pids_limit: 500

  # Mailpit — local SMTP catcher for dev/staging.
  # NC sends emails to mailpit:1025 → view them at http://localhost:8025
  # When you have a real SMTP provider, just change mail_smtphost in airgap.config.php.
  mailpit:
    image: localhost:5000/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI to view caught emails
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100

  app:
    image: localhost:5000/karsaaz-cloud:31-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${NC_PORT}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_TRUSTED_DOMAINS}
      COLLABORA_INTERNAL_URL: http://collabora:9980
      COLLABORA_PUBLIC_URL: ${COLLABORA_PUBLIC_URL:-http://localhost:9980}
    volumes:
      - app_data:/var/www/html
      - ./airgap.config.php:/airgap.config.php:ro
      - ./hooks:/docker-entrypoint-hooks.d:ro
      - ./php-hardening.ini:/usr/local/etc/php/conf.d/zz-hardening.ini:ro
      - ./apache-hardening.conf:/etc/apache2/conf-enabled/zz-hardening.conf:ro
      - ./themes/karsaaz:/var/www/html/themes/karsaaz:ro
      - ./apps/karsaaz_quota:/var/www/html/apps/karsaaz_quota:ro
      - ./apps/karsaaz_erp_bridge:/var/www/html/apps/karsaaz_erp_bridge:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 2g
    pids_limit: 300

  # ── MongoDB (required by Rocket.Chat) ─────────────────────────────────────
  # Internal only — not exposed on host. Data persisted in rocketchat_mongo volume.
  mongo:
    image: localhost:5000/mongo:6
    restart: unless-stopped
    command: ["mongod", "--noauth", "--bind_ip_all"]
    volumes:
      - rocketchat_mongo:/data/db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    mem_limit: 1g
    pids_limit: 200

  # ── Rocket.Chat ────────────────────────────────────────────────────────────
  # Build from your own source and push to localhost:5000/rocketchat:latest,
  # or replace the image with the official rocketchat/rocketchat:latest for testing.
  # All telemetry/marketplace/push disabled via OVERWRITE_SETTING_ env vars.
  rocketchat:
    image: localhost:5000/rocketchat:latest
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "${RC_PORT:-3000}:3000"
    environment:
      ROOT_URL: "${RC_ROOT_URL:-http://localhost:3000}"
      MONGO_URL: "mongodb://mongo:27017/rocketchat"
      MONGO_OPLOG_URL: "mongodb://mongo:27017/local"
      # Disable all external connections
      OVERWRITE_SETTING_Statistics_Enabled: "false"
      OVERWRITE_SETTING_Nps_Next_Run_Date: ""
      OVERWRITE_SETTING_Push_enable: "false"
      OVERWRITE_SETTING_Livechat_enabled: "false"
      OVERWRITE_SETTING_Marketplace_enabled: "false"
      OVERWRITE_SETTING_Allow_Marketing_Emails: "false"
      OVERWRITE_SETTING_Register_Server: "false"
      OVERWRITE_SETTING_Troubleshoot_Disable_Push_Notifications: "true"
      OVERWRITE_SETTING_Accounts_OAuth_Github: "false"
      OVERWRITE_SETTING_Accounts_OAuth_Google: "false"
      OVERWRITE_SETTING_Accounts_OAuth_Facebook: "false"
      OVERWRITE_SETTING_Accounts_OAuth_LinkedIn: "false"
      OVERWRITE_SETTING_Accounts_OAuth_Meteor: "false"
      OVERWRITE_SETTING_Accounts_OAuth_Twitter: "false"
      # Admin bootstrap credentials (set in .env)
      RC_ADMIN_USER: "${RC_ADMIN_USER:-karsaaz-admin}"
      RC_ADMIN_PASS: "${RC_ADMIN_PASS:-}"
      RC_ADMIN_EMAIL: "${RC_ADMIN_EMAIL:-admin@karsaaz.local}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 2g
    pids_limit: 500

  # ── Coturn — self-hosted STUN/TURN server ─────────────────────────────────
  # Used by Nextcloud Talk and Jitsi for WebRTC ICE candidate discovery.
  # COTURN_SECRET must be set in .env and match the value in NC Talk admin settings.
  coturn:
    image: localhost:5000/coturn:latest
    restart: unless-stopped
    network_mode: host
    environment:
      DETECT_EXTERNAL_IP: "no"
      LISTENING_PORT: "3478"
      TLS_LISTENING_PORT: "5349"
      REALM: "${COTURN_REALM:-karsaaz.local}"
      STATIC_AUTH_SECRET: "${COTURN_SECRET:-}"
      NO_TLS: "1"
      NO_DTLS: "1"
      CLI_PASSWORD: ""
      FINGERPRINT: "1"
      VERBOSE: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 100

  # ── Jitsi Meet — self-hosted video conferencing ────────────────────────────
  # Build from your own code and push to localhost:5000/jitsi-* images,
  # or replace with official jitsi/* images for initial setup.
  # All analytics/third-party services disabled.

  jitsi-prosody:
    image: localhost:5000/jitsi-prosody:latest
    restart: unless-stopped
    environment:
      XMPP_DOMAIN: "${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_AUTH_DOMAIN: "auth.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_MUC_DOMAIN: "muc.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      JICOFO_AUTH_USER: jicofo
      JICOFO_AUTH_PASSWORD: "${JITSI_JICOFO_PASSWORD:-}"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "${JITSI_JVB_PASSWORD:-}"
      JIBRI_AUTH_USER: jibri
      JIBRI_AUTH_PASSWORD: "${JITSI_JIBRI_PASSWORD:-}"
      TZ: "Asia/Karachi"
    volumes:
      - jitsi_prosody:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 512m
    pids_limit: 100

  jitsi-jicofo:
    image: localhost:5000/jitsi-jicofo:latest
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    environment:
      XMPP_SERVER: jitsi-prosody
      XMPP_DOMAIN: "${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_AUTH_DOMAIN: "auth.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      JICOFO_AUTH_USER: jicofo
      JICOFO_AUTH_PASSWORD: "${JITSI_JICOFO_PASSWORD:-}"
      TZ: "Asia/Karachi"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 512m
    pids_limit: 100

  jitsi-jvb:
    image: localhost:5000/jitsi-jvb:latest
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    ports:
      - "${JITSI_JVB_PORT:-10000}:10000/udp"
    environment:
      XMPP_SERVER: jitsi-prosody
      XMPP_AUTH_DOMAIN: "auth.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "${JITSI_JVB_PASSWORD:-}"
      # Point JVB at Coturn for STUN (LAN IPs only — no external STUN servers)
      JVB_STUN_SERVERS: "coturn:3478"
      JVB_TCP_HARVESTER_DISABLED: "true"
      TZ: "Asia/Karachi"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 1g
    pids_limit: 200

  jitsi-web:
    image: localhost:5000/jitsi-web:latest
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    ports:
      - "${JITSI_PORT:-8443}:80"
    environment:
      PUBLIC_URL: "${JITSI_PUBLIC_URL:-http://localhost:8443}"
      XMPP_DOMAIN: "${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_AUTH_DOMAIN: "auth.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_MUC_DOMAIN: "muc.${JITSI_DOMAIN:-jitsi.karsaaz.local}"
      XMPP_BOSH_URL_BASE: "http://jitsi-prosody:5280"
      JICOFO_AUTH_USER: jicofo
      # Disable all analytics and third-party integrations
      ENABLE_STATS_ID: "0"
      CALLSTATS_ID: ""
      AMPLITUDE_ID: ""
      RTCSTATS_ENABLED: "false"
      DISABLE_DEEP_LINKING: "1"
      ENABLE_WELCOME_PAGE: "1"
      TZ: "Asia/Karachi"
    volumes:
      - jitsi_web:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 512m
    pids_limit: 100

volumes:
  db_data:
    name: karsaaz-cloud_db_data
    external: true
  app_data:
    name: karsaaz-cloud_app_data
    external: true
  rocketchat_mongo:
    name: karsaaz-cloud_rocketchat_mongo
  jitsi_prosody:
    name: karsaaz-cloud_jitsi_prosody
  jitsi_web:
    name: karsaaz-cloud_jitsi_web
