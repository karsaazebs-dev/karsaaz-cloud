# Apache hardening overrides — mounted into /etc/apache2/conf-enabled/

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

# ── CORS — handle OPTIONS preflight first (must be 2xx for browser to proceed) ─
# mod_rewrite intercepts the OPTIONS request before it reaches PHP/Nextcloud
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^OPTIONS$
    RewriteCond %{HTTP:Origin} "^http://(localhost|127\.0\.0\.1|192\.168\.18\.97|192\.168\.100\.25):3000$"
    RewriteRule ^ - [R=204,L]
</IfModule>

# ── CORS — set CORS headers on all matching-origin responses ────────────────
<IfModule mod_headers.c>
    SetEnvIf Origin "^http://localhost:3000$"          CORS_ALLOWED_ORIGIN=$0
    SetEnvIf Origin "^http://127\.0\.0\.1:3000$"       CORS_ALLOWED_ORIGIN=$0
    SetEnvIf Origin "^http://192\.168\.18\.97:3000$"   CORS_ALLOWED_ORIGIN=$0
    SetEnvIf Origin "^http://192\.168\.100\.25:3000$"  CORS_ALLOWED_ORIGIN=$0

    Header always set Access-Control-Allow-Origin      "%{CORS_ALLOWED_ORIGIN}e" env=CORS_ALLOWED_ORIGIN
    Header always set Access-Control-Allow-Credentials "true"                    env=CORS_ALLOWED_ORIGIN
    Header always set Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, REPORT, LOCK, UNLOCK" env=CORS_ALLOWED_ORIGIN
    Header always set Access-Control-Allow-Headers     "Authorization, Content-Type, Depth, Destination, If, If-Match, If-None-Match, Lock-Token, OCS-APIREQUEST, Overwrite, X-Requested-With, X-OC-Mtime" env=CORS_ALLOWED_ORIGIN
    Header always set Access-Control-Max-Age           "86400"                   env=CORS_ALLOWED_ORIGIN
</IfModule>

# ── Security headers ─────────────────────────────────────────────────────────
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "interest-cohort=()"
    Header unset X-Powered-By
    Header unset Server
</IfModule>
