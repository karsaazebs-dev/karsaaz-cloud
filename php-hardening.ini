; PHP hardening overrides — mounted into /usr/local/etc/php/conf.d/
; Goals: hide PHP version, lock down sessions, block remote includes.
; NOTE: disable_functions intentionally NOT set — Karsaaz Cloud requires exec/proc_open
; for previews, encryption, and background jobs.

expose_php = Off
allow_url_include = Off
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
